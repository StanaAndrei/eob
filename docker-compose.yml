services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: eob
      MYSQL_USER: ${DB_USERNAME:-eob_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-eob_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy
      command: sh -c "npm run migration:run && npm run seed:run && npm run start:dev"
      environment:
        PORT: 3001
        DB_HOST: db
        DB_PORT: 3306
        DB_USERNAME: ${DB_USERNAME:-eob_user}
        DB_PASSWORD: ${DB_PASSWORD:-eob_pass}
        NODE_ENV: dev
      ports:
        - "3001:3001"
      volumes:
        - ./backend:/app
        - /app/node_modules

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
      restart: unless-stopped
      depends_on:
        - backend
      environment:
        VITE_API_URL: http://localhost:3001/api
      ports:
        - "5173:5173"
      volumes:
        - ./frontend:/app
        - /app/node_modules

volumes:
  mysql_data: